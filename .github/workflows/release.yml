# Release for basic-kanban-board-mcp.
#
# Triggered by pushing a v* tag (also re-runnable via workflow_dispatch).
# GoReleaser handles the multi-arch build, checksum, SBOM, and the multi-arch
# image push to ghcr.

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release from (e.g. v1.0.0)"
        required: true

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Show toolchain
        run: go version

      # GoReleaser pushes images to ghcr as part of `release`, so the registry
      # login has to happen BEFORE it runs, not after. The previous ordering
      # (login after) plus an `if: env.GHCR_LOGIN == 'true'` guard on a variable
      # nothing ever set meant the login never ran and every image push failed.
      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # QEMU + Buildx let the arm64 image build on the amd64 runner, so the
      # docker_manifests multi-arch list actually has a real arm64 image behind
      # it instead of an amd64 binary mislabeled arm64.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The verify job downloads this. Without the upload it downloaded nothing
      # and the release went out unverified.
      - name: Upload dist for verification
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  verify:
    name: Verify release artefacts
    runs-on: ubuntu-latest
    needs: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Show artefact summary
        run: |
          ls -la dist
          shasum -a 256 dist/*.txt 2>/dev/null || sha256sum dist/*.txt
      - name: Smoke-test linux/amd64 binary
        run: |
          ./dist/kanban_linux_amd64_v1/kanban version
          ./dist/kanban_linux_amd64_v1/kanban doctor --addr=127.0.0.1:8080