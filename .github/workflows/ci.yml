# CI for basic-kanban-board-mcp.
#
# Matrix: ubuntu + windows, every push and PR.
# Pipeline (each matrix):
#   1. checkout
#   2. setup Go 1.27
#   3. go vet ./...
#   4. go test ./... -race
#   5. staticcheck (best-effort, only on ubuntu; continue-on-error)
#   6. govulncheck (best-effort)
#   7. build kanban binary
#   8. run `kanban version` and `kanban doctor` as smoke tests
#

name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  embed-mirror:
    name: embed mirrors in sync
    runs-on: ubuntu-latest
    # Fail fast on drift before the heavier build job wastes 8 minutes of
    # CI. The check is platform-agnostic (diff + find); ubuntu only because
    # GNU make + diff are already there and the rest of CI uses the same
    # runner. This is the early warning that catches the drift described
    # in docs/tasks/E-review-2.md.
    steps:
      - uses: actions/checkout@v4

      - name: Install make
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends make

      - name: Check embed mirrors
        run: |
          set -euo pipefail
          # Cross-platform diff: works on Linux + macOS. We deliberately avoid
          # `make check-embed` here so the check runs even when make is
          # missing (the job installs make too, but a script-only check
          # doubles as documentation of what "in sync" means).
          status=0
          for pair in "web/static internal/web/static" "web/templates internal/web/templates"; do
              set -- $pair
              src=$1; dst=$2
              if [ ! -d "$src" ] || [ ! -d "$dst" ]; then
                  echo "::error::$src or $dst missing"
                  status=1
                  continue
              fi
              # diff -r --brief prints "Files X and Y differ" and "Only in ..."
              # for any divergence. The templates.go file legitimately lives
              # only in the embedded tree (it is the embed directive itself)
              # so we filter it out.
              out=$(diff -r --brief "$src" "$dst" 2>&1 \
                  | grep -v "^Only in $dst: templates\.go$" || true)
              if [ -n "$out" ]; then
                  echo "::error::$dst is out of sync with $src"
                  echo "$out"
                  echo "Run 'make sync-embed' and commit the result."
                  status=1
              fi
          done
          exit $status

  build:
    name: build/test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: embed-mirror
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        go: ["1.27"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Show toolchain
        run: go version

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: CGO_ENABLED=1 go test ./... -race -count=1 -timeout=10m

      - name: staticcheck (ubuntu only)
        if: runner.os == 'Linux'
        uses: dominikbraun/graph@v1
        with:
          # staticcheck is not in deps.go because it is dev-only. Install
          # it just for this step. Failure is non-fatal: staticcheck
          # periodically flags stdlib constructs and Go-ecosystem changes.
          continue-on-error: true

      - name: govulncheck (ubuntu only)
        if: runner.os == 'Linux'
        env:
          GOFLAGS: -mod=mod
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Build kanban binary
        run: |
          mkdir -p bin
          go build -trimpath -ldflags "-s -w" -o bin/kanban ./cmd/kanban

      - name: Smoke test (ubuntu)
        if: runner.os == 'Linux'
        run: |
          ./bin/kanban version
          ./bin/kanban doctor --addr=127.0.0.1:8080

      - name: Smoke test (windows)
        if: runner.os == 'Windows'
        run: |
          ./bin/kanban.exe version
          ./bin/kanban.exe doctor --addr=127.0.0.1:8080